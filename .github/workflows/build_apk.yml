name: Build Alias APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure local.properties and Gradle
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Optimized Split-ABI Android Release APKs
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false -Dandroid.builtInKotlin=false"
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare APK outputs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Alias-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Alias-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Alias.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Alias-arm64-v8a.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alias-arm64-v8a-APK
          path: build/app/outputs/flutter-apk/Alias-arm64-v8a.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Alias v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 📱 Alias Android Release APK (Lightweight ~30MB)
            
            Download and install **`Alias-arm64-v8a.apk`** (or `Alias.apk`) directly on your Android device!
            
            #### 📦 Downloads:
            - 📲 **[`Alias-arm64-v8a.apk`](https://github.com/sadmanerror/Alias/releases/latest/download/Alias-arm64-v8a.apk)** (~30MB — Recommended for all modern Android phones)
            - 📲 **[`Alias-armeabi-v7a.apk`](https://github.com/sadmanerror/Alias/releases/latest/download/Alias-armeabi-v7a.apk)** (~25MB — For older 32-bit Android devices)
            - 📲 **[`Alias.apk`](https://github.com/sadmanerror/Alias/releases/latest/download/Alias.apk)** (~30MB — Direct download)
            
            #### ✨ Highlights:
            - ⚡ Instant real-time 1-on-1 private messaging
            - 🖼️ Free device photo & media sharing (no paid cloud required)
            - 🎙️ Voice messages with waveform playback
            - 📞 Audio & Video calls powered by Agora RTC
            - 👤 Profile customization directly from your device's Camera or Gallery
          files: |
            build/app/outputs/flutter-apk/Alias-arm64-v8a.apk
            build/app/outputs/flutter-apk/Alias-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Alias.apk
