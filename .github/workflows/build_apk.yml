name: Build Alias APK and Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK & Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure local.properties and Gradle
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Optimized Split-ABI Android Release APKs
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false -Dandroid.builtInKotlin=false"
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare APK outputs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Alias-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Alias-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Alias.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Build Web PWA for iOS & Browsers
        run: flutter build web --release --base-href="/Alias/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Upload Alias-arm64-v8a.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alias-arm64-v8a-APK
          path: build/app/outputs/flutter-apk/Alias-arm64-v8a.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Alias v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 📱 Alias Android Release APK & iOS Web App

            #### 📲 Android Download:
            - **[`Alias-arm64-v8a.apk`](https://github.com/sadmanerror/Alias/releases/latest/download/Alias-arm64-v8a.apk)** (~30MB — Modern Android phones)
            - **[`Alias-armeabi-v7a.apk`](https://github.com/sadmanerror/Alias/releases/latest/download/Alias-armeabi-v7a.apk)** (~25MB — Older 32-bit Android phones)

            #### 🍎 iOS / iPhone & Web Users:
            - Open **[https://sadmanerror.github.io/Alias/](https://sadmanerror.github.io/Alias/)** in Safari.
            - Tap **Share (`↑`)** -> **Add to Home Screen** to install as a native iOS app!
          files: |
            build/app/outputs/flutter-apk/Alias-arm64-v8a.apk
            build/app/outputs/flutter-apk/Alias-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Alias.apk

  deploy-pages:
    name: Deploy Web App to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
