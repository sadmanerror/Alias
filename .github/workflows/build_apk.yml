name: Build Alias APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure local.properties and Gradle
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false -Dandroid.builtInKotlin=false"
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare APK output
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Alias.apk

      - name: Upload Alias.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alias-APK
          path: build/app/outputs/flutter-apk/Alias.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Alias v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 📱 Alias Android Release APK
            
            Download and install **`Alias.apk`** directly on any Android device.
            
            #### ✨ Highlights:
            - ⚡ Instant real-time 1-on-1 private messaging
            - 🖼️ Free device photo & media sharing
            - 🎙️ Voice messages with interactive waveform playback
            - 📞 Audio and video calls
            - 🎨 Minimalist Sage & Warm Sand aesthetics
            - 👤 Profile customization directly from your device's Camera or Gallery
          files: build/app/outputs/flutter-apk/Alias.apk
