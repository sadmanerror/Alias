name: alias
description: A secure, private real-time messaging application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  # Agora
  agora_rtc_engine: ^6.5.0
  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  # Audio
  record: ^5.1.2
  audioplayers: ^6.1.0
  audio_waveforms: ^1.3.0
  # Emoji & GIF  
  emoji_picker_flutter: ^4.4.0
  cached_network_image: ^3.4.1
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^14.6.2
  # Local DB
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # Google Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  # Permissions
  permission_handler: ^11.3.1
  # Utils
  path_provider: ^2.1.4
  archive: ^3.6.1
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  equatable: ^2.0.5
  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  timeago: ^3.7.0
  video_player: ^2.9.1
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.3.2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
